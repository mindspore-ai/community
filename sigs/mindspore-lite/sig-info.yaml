name: MindSpore Lite
description: 'MindSpore Lite面向多种硬件后端设备（昇腾、麒麟等）提供轻量化AI推理加速能力，使能智能应用，为开发者提供端到端的解决方案，为算法工程师和数据科学家提供开发友好、运行高效、部署灵活的体验。'
description_en: 'MindSpore Lite provides lightweight AI inference acceleration capabilities for a variety of hardware backend devices (Ascend, Kirin, etc.), enabling intelligent applications, providing developers with end-to-end solutions, and offering algorithm engineers and data scientists a development-friendly, efficient, and flexible deployment experience.'
