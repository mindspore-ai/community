name: AKG
description: MindSpore AKG SIG 专注于利用 MindSpore AKG 在算子编译和算子生成领域的技术积累，持续完善软件功能，拓展社区生态，为科研人员、教师、学生以及对此领域有深厚兴趣和强大影响力的人们提供一个高效易用的图计算融合编译器，同时提供一个共同交流合作的平台。
description_en: The MindSpore AKG SIG focuses on leveraging the technical accumulation of MindSpore AKG in the field of operator compilation and operator generation, continuously improving software functionality, expanding the community ecosystem, and providing an efficient and easy-to-use graph computation fusion compiler for researchers, teachers, students, and those with a deep interest and strong influence in this field, while also providing a platform for collaborative communication.
