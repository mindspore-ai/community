name: Trusted AI SIG
description: Trusted AI SIG has two respondisbilities. First, trusted ai focus on models and data trust technology in the field of artificial intelligence, including model robustness and interpretability, privacy computing, model security deployment, and so on. Our goal is to build a secure and trusted AI computing framework. Second, MindSpore Security Committee receives and responds to MindSpore security issues, provides community security guidance, reviews the safety of code, make decision of the security of the code and carries out security governance.
