name: Security & Trusted AI
description: MindSpore Security & Trusted AI SIG包含以下两个职责：第一个是负责接受和响应MindSpore相关的安全问题报告、提供社区安全编码以及规范的指导、进行社区安全编码的评审，制定和决策，开展社区安全治理。第二个是聚焦于人工智能领域的模型、数据可信技术，致力于打造安全可靠的AI计算框架。
description_en: MindSpore Security & Trusted AI SIG has two respondisbilities. First, MindSpore Security receives and responds to MindSpore security issues, provides community security guidance, reviews the safety of code, make decision of the security of the code and carries out security governance. Second, trusted ai focus on models and data trust technology in the field of artificial intelligence, including model robustness and interpretability, privacy computing, model security deployment, and so on. Our goal is to build a secure and trusted AI computing framework.
created_on: '2019-12-31'
