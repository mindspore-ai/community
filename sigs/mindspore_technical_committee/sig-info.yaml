name: MindSpore Technical Committee
description: 昇思MindSpore开源社区技术委员会（MindSpore Technical Committee）是昇思MindSpore开源社区的技术领导机构，负责社区技术决策、技术资源协同调度，保障社区版本高质量发布。
description_en: The MindSpore Technical Committee is the technical steering committee of the MindSpore community. It oversees architectural and technical decision-making, allocates and coordinates technical resources, and ensures that all community releases meet the required standards of quality and reliability.
